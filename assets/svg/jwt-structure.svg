<svg viewBox="0 0 720 380" role="img" aria-labelledby="jwt-structure-t">
<title id="jwt-structure-t">JWT 的三段结构与各自内容</title>
<defs><marker id="jwt-structure-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="jwt-structure-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="jwt-structure-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="jwt-structure-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">JWT 长什么样：三段式，用点号连接</text>
<text class="sf-sub" x="24" y="48">header.payload.signature —— 前两段只是 Base64Url 编码，不是加密</text>
<g class="sf-pop" style="--d:0.08s"><rect class="sf-box-a" x="40" y="90" width="200" height="48" rx="10"/><text class="sf-t-acc sf-mid" x="140" y="114" text-anchor="middle">header</text></g>
<g class="sf-pop" style="--d:0.2s"><rect class="sf-box" x="256" y="90" width="200" height="48" rx="10"/><text class="sf-t sf-mid" x="356" y="114" text-anchor="middle">payload</text></g>
<g class="sf-pop" style="--d:0.32s"><rect class="sf-box-ok" x="472" y="90" width="200" height="48" rx="10"/><text class="sf-t-ok sf-mid" x="572" y="114" text-anchor="middle">signature</text></g>
<circle class="" cx="248" cy="114" r="3.6" fill="var(--sf-accent)" style="--d:0.3s"/>
<circle class="" cx="464" cy="114" r="3.6" fill="var(--sf-accent)" style="--d:0.42s"/>
<g class="sf-pop" style="--d:0.6s"><rect class="sf-box" x="40" y="160" width="200" height="118" rx="10"/><text class="sf-t sf-mid" x="140" y="202" text-anchor="middle">Header</text><text class="sf-mono sf-mid" x="140" y="218" text-anchor="middle">{"alg":"HS256",</text><text class="sf-mono sf-mid" x="140" y="234" text-anchor="middle">"typ":"JWT"}</text></g>
<g class="sf-pop" style="--d:0.72s"><rect class="sf-box" x="256" y="160" width="200" height="118" rx="10"/><text class="sf-t sf-mid" x="356" y="202" text-anchor="middle">Payload</text><text class="sf-mono sf-mid" x="356" y="218" text-anchor="middle">{"sub":"1001",</text><text class="sf-mono sf-mid" x="356" y="234" text-anchor="middle">"exp":1735689600}</text></g>
<g class="sf-pop" style="--d:0.84s"><rect class="sf-box" x="472" y="160" width="200" height="118" rx="10"/><text class="sf-t sf-mid" x="572" y="194" text-anchor="middle">Signature</text><text class="sf-mono sf-mid" x="572" y="210" text-anchor="middle">HMAC(</text><text class="sf-mono sf-mid" x="572" y="226" text-anchor="middle">base64(h)+'.'+</text><text class="sf-mono sf-mid" x="572" y="242" text-anchor="middle">base64(p), secret)</text></g>
<g class="sf-pop" style="--d:1s"><text class="sf-t-warn" x="24" y="312" text-anchor="start">① 前两段只是 Base64Url 编码 —— 任何人都能解开看内容，别往 payload 里放敏感信息。</text></g>
<g class="sf-pop" style="--d:1.1s"><text class="sf-t-ok" x="24" y="336" text-anchor="start">② 签名用服务端密钥算出来 —— 改动任意一个字符，验签立刻失败。</text></g>
</svg>
