<svg viewBox="0 0 720 390" role="img" aria-labelledby="singleflight-t">
<title id="singleflight-t">SingleFlight 把并发请求合并成一次查询</title>
<defs><marker id="singleflight-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="singleflight-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="singleflight-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="singleflight-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">SingleFlight：把并发请求合成一次</text>
<text class="sf-sub" x="24" y="48">缓存失效那一瞬间涌来一堆同样的请求，只应该有一个真正去查数据库</text>
<g class="sf-pop" style="--d:0.05s"><rect class="sf-box" x="24" y="110" width="150" height="42" rx="10"/><text class="sf-t sf-mid" x="99" y="131" text-anchor="middle">请求 1</text></g>
<path class="sf-line sf-draw" d="M174 131 L216 190" pathLength="1" marker-end="url(#singleflight-ah-dim)" style="--d:0.5s"/>
<g class="sf-pop" style="--d:0.13s"><rect class="sf-box" x="24" y="160" width="150" height="42" rx="10"/><text class="sf-t sf-mid" x="99" y="181" text-anchor="middle">请求 2</text></g>
<path class="sf-line sf-draw" d="M174 181 L216 196" pathLength="1" marker-end="url(#singleflight-ah-dim)" style="--d:0.55s"/>
<g class="sf-pop" style="--d:0.21s"><rect class="sf-box" x="24" y="210" width="150" height="42" rx="10"/><text class="sf-t sf-mid" x="99" y="231" text-anchor="middle">请求 3</text></g>
<path class="sf-line sf-draw" d="M174 231 L216 202" pathLength="1" marker-end="url(#singleflight-ah-dim)" style="--d:0.6s"/>
<g class="sf-pop" style="--d:0.29s"><rect class="sf-box" x="24" y="260" width="150" height="42" rx="10"/><text class="sf-t sf-mid" x="99" y="281" text-anchor="middle">请求 4</text></g>
<path class="sf-line sf-draw" d="M174 281 L216 208" pathLength="1" marker-end="url(#singleflight-ah-dim)" style="--d:0.65s"/>
<g class="sf-pop" style="--d:0.4s"><rect class="sf-box-ghost" x="220" y="104" width="190" height="206" rx="14"/><text class="sf-t-sm" x="234" y="120" text-anchor="start">SingleFlight</text></g>
<path class="sf-line-ok sf-draw" d="M410 207 L466 205" pathLength="1" marker-end="url(#singleflight-ah-ok)" style="--d:0.75s"/>
<g class="sf-pop" style="--d:0.8s"><text class="sf-t-ok" x="438" y="196" text-anchor="middle">只查 1 次</text></g>
<g class="sf-pop" style="--d:0.7s"><rect class="sf-box-ok" x="470" y="170" width="220" height="70" rx="10"/><text class="sf-t-ok sf-mid" x="580" y="197" text-anchor="middle">MySQL</text><text class="sf-t-sm sf-mid" x="580" y="215" text-anchor="middle">不会被并发打爆</text></g>
<path class="sf-line sf-flow" d="M315 314 L315 336 L99 336 L99 306" marker-end="url(#singleflight-ah-acc)" stroke-dasharray="5 5"/>
<g class="sf-pop" style="--d:0.9s"><text class="sf-t-dim" x="207" y="358" text-anchor="middle">结果回传给所有等待的请求</text></g>
</svg>
