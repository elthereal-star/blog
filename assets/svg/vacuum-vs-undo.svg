<svg viewBox="0 0 720 400" role="img" aria-labelledby="vacuum-vs-undo-t">
<title id="vacuum-vs-undo-t">heap 与 OrioleDB 处理旧行版本的对比</title>
<defs><marker id="vacuum-vs-undo-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="vacuum-vs-undo-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="vacuum-vs-undo-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="vacuum-vs-undo-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">同样一次 UPDATE，两种引擎留下的东西不一样</text>
<text class="sf-sub" x="24" y="48">heap 把旧版本留在表里等 VACUUM 来收；OrioleDB 把它推进 undo log 自动覆盖</text>
<g class="sf-pop" style="--d:0.05s"><text class="sf-t-warn" x="24" y="92" text-anchor="start">① heap：旧版本留在表里</text></g>
<g class="sf-pop" style="--d:0.12s"><rect class="sf-box-warn" x="24" y="104" width="230" height="78" rx="10"/><text class="sf-t-warn sf-mid" x="139" y="135" text-anchor="middle">表文件</text><text class="sf-t-sm sf-mid" x="139" y="153" text-anchor="middle">活数据 + 死元组</text></g>
<path class="sf-line sf-draw" d="M254 143 L290 143" pathLength="1" marker-end="url(#vacuum-vs-undo-ah-acc)" style="--d:0.22s"/>
<g class="sf-pop" style="--d:0.32s"><rect class="sf-box" x="294" y="104" width="120" height="78" rx="10"/><text class="sf-t sf-mid" x="354" y="135" text-anchor="middle">VACUUM</text><text class="sf-t-sm sf-mid" x="354" y="153" text-anchor="middle">定期全表扫</text></g>
<path class="sf-line sf-draw" d="M414 143 L450 143" pathLength="1" marker-end="url(#vacuum-vs-undo-ah-acc)" style="--d:0.42s"/>
<g class="sf-pop" style="--d:0.52s"><rect class="sf-box" x="454" y="104" width="242" height="78" rx="10"/><text class="sf-t sf-mid" x="575" y="135" text-anchor="middle">空间回收</text><text class="sf-t-sm sf-mid" x="575" y="153" text-anchor="middle">标记为可复用</text></g>
<g class="sf-pop" style="--d:0.62s"><text class="sf-t-warn" x="24" y="206" text-anchor="start">死元组一直占着页，表持续膨胀；VACUUM 全表扫期间还要和业务抢 IO</text></g>
<path class="sf-line sf-draw" d="M24 232 L696 232" pathLength="1" stroke-dasharray="4 4" stroke-opacity="0.5" style="--d:0.7s"/>
<g class="sf-pop" style="--d:0.78s"><text class="sf-t-ok" x="24" y="262" text-anchor="start">② OrioleDB：旧版本推进 undo log</text></g>
<g class="sf-pop" style="--d:0.85s"><rect class="sf-box-ok" x="24" y="274" width="230" height="78" rx="10"/><text class="sf-t-ok sf-mid" x="139" y="305" text-anchor="middle">表文件</text><text class="sf-t-sm sf-mid" x="139" y="323" text-anchor="middle">只有活数据</text></g>
<path class="sf-line sf-draw" d="M254 313 L290 313" pathLength="1" marker-end="url(#vacuum-vs-undo-ah-acc)" style="--d:0.92s"/>
<g class="sf-pop" style="--d:1s"><rect class="sf-box-a" x="294" y="274" width="402" height="78" rx="10"/><text class="sf-t sf-mid" x="495" y="305" text-anchor="middle">undo log（环形 buffer）</text><text class="sf-t-sm sf-mid" x="495" y="323" text-anchor="middle">满了自动覆盖，永远不用 VACUUM</text></g>
<g class="sf-pop" style="--d:1.1s"><text class="sf-t-ok" x="24" y="376" text-anchor="start">没有死元组堆积，也不用再给 VACUUM 排维护窗口</text></g>
</svg>
