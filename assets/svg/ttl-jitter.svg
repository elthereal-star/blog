<svg viewBox="0 0 720 380" role="img" aria-labelledby="ttl-jitter-t">
<title id="ttl-jitter-t">随机 TTL 打散过期时间</title>
<defs><marker id="ttl-jitter-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ttl-jitter-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ttl-jitter-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ttl-jitter-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">随机 TTL 防抖：把过期时间打散</text>
<text class="sf-sub" x="24" y="48">雪崩的根因是「同时过期」，最便宜的解法就是给 TTL 加一个随机偏移</text>
<g class="sf-pop" style="--d:0.05s"><rect class="sf-box-strong" x="24" y="84" width="660" height="62" rx="10"/><text class="sf-t sf-mid" x="354" y="115" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.1s"><text class="sf-t sf-mono" x="354" y="108" text-anchor="middle">TTL = BASE_TTL + random(0, JITTER)</text></g>
<g class="sf-pop" style="--d:0.2s"><text class="sf-t-sm" x="354" y="132" text-anchor="middle">例：基础 30 分钟 + 随机 0~5 分钟</text></g>
<g class="sf-pop" style="--d:0.3s"><rect class="sf-box-ghost" x="24" y="166" width="320" height="140" rx="14"/><text class="sf-t-sm" x="38" y="182" text-anchor="start">无抖动</text></g>
<path class="sf-line-dim" d="M40 290 L324 290"/>
<g class="sf-pop" style="--d:0.4s"><rect class="sf-box-warn" x="168" y="200" width="30" height="90" rx="4"/><text class="sf-t sf-mid" x="183" y="245" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.5s"><text class="sf-t-sm" x="183" y="194" text-anchor="middle">所有 key 同一秒过期</text></g>
<g class="sf-pop" style="--d:0.55s"><rect class="sf-box-ghost" x="376" y="166" width="320" height="140" rx="14"/><text class="sf-t-sm" x="390" y="182" text-anchor="start">加抖动</text></g>
<path class="sf-line-dim" d="M392 290 L676 290"/>
<g class="sf-pop" style="--d:0.65s"><rect class="sf-box-ok" x="400" y="260" width="16" height="30" rx="4"/><text class="sf-t sf-mid" x="408" y="275" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.69s"><rect class="sf-box-ok" x="424" y="238" width="16" height="52" rx="4"/><text class="sf-t sf-mid" x="432" y="264" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.73s"><rect class="sf-box-ok" x="448" y="252" width="16" height="38" rx="4"/><text class="sf-t sf-mid" x="456" y="271" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.77s"><rect class="sf-box-ok" x="472" y="226" width="16" height="64" rx="4"/><text class="sf-t sf-mid" x="480" y="258" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.81s"><rect class="sf-box-ok" x="496" y="246" width="16" height="44" rx="4"/><text class="sf-t sf-mid" x="504" y="268" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.85s"><rect class="sf-box-ok" x="520" y="232" width="16" height="58" rx="4"/><text class="sf-t sf-mid" x="528" y="261" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.89s"><rect class="sf-box-ok" x="544" y="254" width="16" height="36" rx="4"/><text class="sf-t sf-mid" x="552" y="272" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.93s"><rect class="sf-box-ok" x="568" y="224" width="16" height="66" rx="4"/><text class="sf-t sf-mid" x="576" y="257" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:0.97s"><rect class="sf-box-ok" x="592" y="244" width="16" height="46" rx="4"/><text class="sf-t sf-mid" x="600" y="267" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:1.01s"><rect class="sf-box-ok" x="616" y="236" width="16" height="54" rx="4"/><text class="sf-t sf-mid" x="624" y="263" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:1.05s"><rect class="sf-box-ok" x="640" y="256" width="16" height="34" rx="4"/><text class="sf-t sf-mid" x="648" y="273" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:1.09s"><rect class="sf-box-ok" x="664" y="240" width="16" height="50" rx="4"/><text class="sf-t sf-mid" x="672" y="265" text-anchor="middle"></text></g>
<g class="sf-pop" style="--d:1.1s"><text class="sf-t-sm" x="536" y="194" text-anchor="middle">过期时刻被均匀摊开</text></g>
<g class="sf-pop" style="--d:1.25s"><text class="sf-t-dim" x="24" y="348" text-anchor="start">抖动只改变「什么时候过期」，不影响数据本身的缓存时长设计。</text></g>
</svg>
