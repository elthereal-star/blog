<svg viewBox="0 0 720 400" role="img" aria-labelledby="jwt-login-flow-t">
<title id="jwt-login-flow-t">JWT 登录认证的完整流程</title>
<defs><marker id="jwt-login-flow-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="jwt-login-flow-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="jwt-login-flow-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="jwt-login-flow-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">JWT 登录认证的完整流程</text>
<text class="sf-sub" x="24" y="48">登录只发生一次，之后每次请求都靠 token 自己证明身份</text>
<g class="sf-pop" style="--d:0.05s"><rect class="sf-box" x="24" y="100" width="200" height="84" rx="10"/><text class="sf-t sf-mid" x="124" y="125" text-anchor="middle">① 提交账号密码</text><text class="sf-mono sf-mid" x="124" y="141" text-anchor="middle">POST /login</text><text class="sf-t-sm sf-mid" x="124" y="157" text-anchor="middle">password 不明文存</text></g>
<g class="sf-pop" style="--d:0.17s"><rect class="sf-box" x="250" y="100" width="200" height="84" rx="10"/><text class="sf-t sf-mid" x="350" y="125" text-anchor="middle">② 校验并签发</text><text class="sf-t-sm sf-mid" x="350" y="141" text-anchor="middle">查库比对密码</text><text class="sf-t-sm sf-mid" x="350" y="157" text-anchor="middle">生成 JWT</text></g>
<g class="sf-pop" style="--d:0.29s"><rect class="sf-box" x="476" y="100" width="200" height="84" rx="10"/><text class="sf-t sf-mid" x="576" y="125" text-anchor="middle">③ 客户端保存</text><text class="sf-mono sf-mid" x="576" y="141" text-anchor="middle">localStorage</text><text class="sf-t-sm sf-mid" x="576" y="157" text-anchor="middle">或 HttpOnly Cookie</text></g>
<path class="sf-line sf-draw" d="M224 142 L248 142" pathLength="1" marker-end="url(#jwt-login-flow-ah-acc)" style="--d:0.4s"/>
<path class="sf-line sf-draw" d="M450 142 L474 142" pathLength="1" marker-end="url(#jwt-login-flow-ah-acc)" style="--d:0.45s"/>
<path class="sf-line sf-draw" d="M124 186 L124 212" pathLength="1" marker-end="url(#jwt-login-flow-ah-acc)" style="--d:0.55s"/>
<g class="sf-pop" style="--d:0.6s"><text class="sf-t-sm" x="132" y="202" text-anchor="start">之后每次请求，都带上这个 token</text></g>
<g class="sf-pop" style="--d:0.7s"><rect class="sf-box" x="24" y="216" width="200" height="84" rx="10"/><text class="sf-t sf-mid" x="124" y="241" text-anchor="middle">④ 带上 token</text><text class="sf-mono sf-mid" x="124" y="257" text-anchor="middle">Authorization:</text><text class="sf-mono sf-mid" x="124" y="273" text-anchor="middle">Bearer &lt;token&gt;</text></g>
<g class="sf-pop" style="--d:0.8s"><rect class="sf-box" x="250" y="216" width="200" height="84" rx="10"/><text class="sf-t sf-mid" x="350" y="241" text-anchor="middle">⑤ 过滤器验签</text><text class="sf-t-sm sf-mid" x="350" y="257" text-anchor="middle">验签名 + 查过期</text><text class="sf-t-sm sf-mid" x="350" y="273" text-anchor="middle">不查数据库</text></g>
<g class="sf-pop" style="--d:0.9s"><rect class="sf-box" x="476" y="216" width="200" height="84" rx="10"/><text class="sf-t sf-mid" x="576" y="241" text-anchor="middle">⑥ 放行或拒绝</text><text class="sf-t-ok sf-mid" x="576" y="257" text-anchor="middle">通过 → 正常返回</text><text class="sf-t-warn sf-mid" x="576" y="273" text-anchor="middle">失败 → 401</text></g>
<path class="sf-line sf-draw" d="M224 258 L248 258" pathLength="1" marker-end="url(#jwt-login-flow-ah-acc)" style="--d:0.95s"/>
<path class="sf-line sf-draw" d="M450 258 L474 258" pathLength="1" marker-end="url(#jwt-login-flow-ah-acc)" style="--d:1s"/>
<g class="sf-pop" style="--d:1.1s"><text class="sf-t-dim" x="24" y="340" text-anchor="start">① 服务端不保存会话 —— JWT 是自包含的，验签通过即认为身份有效。</text></g>
<g class="sf-pop" style="--d:1.2s"><text class="sf-t-dim" x="24" y="364" text-anchor="start">② 代价是「注销」变难：token 一旦签发，过期前一直有效，需要额外的黑名单机制。</text></g>
</svg>
