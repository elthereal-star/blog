<svg viewBox="0 0 720 430" role="img" aria-labelledby="kafka-roles-t">
<title id="kafka-roles-t">Kafka 中 Broker、Topic、Partition、Replica 的关系</title>
<defs><marker id="kafka-roles-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="kafka-roles-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="kafka-roles-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="kafka-roles-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">Kafka 的四大天王到底啥关系</text>
<text class="sf-sub" x="24" y="48">一个 Topic 拆成多个 Partition，每个 Partition 在多个 Broker 上存多份 Replica</text>
<g class="sf-pop" style="--d:0.05s"><rect class="sf-box-strong" x="184" y="64" width="418" height="50" rx="10"/><text class="sf-t sf-mid" x="393" y="81" text-anchor="middle">Topic：订单消息</text><text class="sf-t-sm sf-mid" x="393" y="99" text-anchor="middle">逻辑上的消息分类</text></g>
<path class="sf-line sf-draw" d="M247 114 L247 132" pathLength="1" marker-end="url(#kafka-roles-ah-acc)" style="--d:0.25s"/>
<g class="sf-pop" style="--d:0.35s"><text class="sf-t-acc" x="247" y="144" text-anchor="middle">P0</text></g>
<path class="sf-line sf-draw" d="M393 114 L393 132" pathLength="1" marker-end="url(#kafka-roles-ah-acc)" style="--d:0.25s"/>
<g class="sf-pop" style="--d:0.35s"><text class="sf-t-acc" x="393" y="144" text-anchor="middle">P1</text></g>
<path class="sf-line sf-draw" d="M539 114 L539 132" pathLength="1" marker-end="url(#kafka-roles-ah-acc)" style="--d:0.25s"/>
<g class="sf-pop" style="--d:0.35s"><text class="sf-t-acc" x="539" y="144" text-anchor="middle">P2</text></g>
