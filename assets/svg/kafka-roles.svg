<g class="sf-pop" style="--d:0.55s"><rect class="sf-box-solid" x="184" y="160" width="126" height="46" rx="10"/><text class="sf-t-inv sf-mid" x="247" y="183" text-anchor="middle">Leader</text></g>
<g class="sf-pop" style="--d:0.61s"><rect class="sf-box-a" x="330" y="160" width="126" height="46" rx="10"/><text class="sf-t-acc sf-mid" x="393" y="183" text-anchor="middle">Follower</text></g>
<g class="sf-pop" style="--d:0.67s"><rect class="sf-box-a" x="476" y="160" width="126" height="46" rx="10"/><text class="sf-t-acc sf-mid" x="539" y="183" text-anchor="middle">Follower</text></g>
<g class="sf-pop" style="--d:0.55s"><rect class="sf-box-strong" x="24" y="222" width="140" height="46" rx="10"/><text class="sf-t sf-mid" x="94" y="245" text-anchor="middle">Broker 1</text></g>
<g class="sf-pop" style="--d:0.65s"><rect class="sf-box-a" x="184" y="222" width="126" height="46" rx="10"/><text class="sf-t-acc sf-mid" x="247" y="245" text-anchor="middle">Follower</text></g>
<g class="sf-pop" style="--d:0.71s"><rect class="sf-box-solid" x="330" y="222" width="126" height="46" rx="10"/><text class="sf-t-inv sf-mid" x="393" y="245" text-anchor="middle">Leader</text></g>
<g class="sf-pop" style="--d:0.77s"><rect class="sf-box-a" x="476" y="222" width="126" height="46" rx="10"/><text class="sf-t-acc sf-mid" x="539" y="245" text-anchor="middle">Follower</text></g>
<g class="sf-pop" style="--d:0.65s"><rect class="sf-box-strong" x="24" y="284" width="140" height="46" rx="10"/><text class="sf-t sf-mid" x="94" y="307" text-anchor="middle">Broker 2</text></g>
<g class="sf-pop" style="--d:0.75s"><rect class="sf-box-a" x="184" y="284" width="126" height="46" rx="10"/><text class="sf-t-acc sf-mid" x="247" y="307" text-anchor="middle">Follower</text></g>
<g class="sf-pop" style="--d:0.81s"><rect class="sf-box-a" x="330" y="284" width="126" height="46" rx="10"/><text class="sf-t-acc sf-mid" x="393" y="307" text-anchor="middle">Follower</text></g>
<g class="sf-pop" style="--d:0.87s"><rect class="sf-box-solid" x="476" y="284" width="126" height="46" rx="10"/><text class="sf-t-inv sf-mid" x="539" y="307" text-anchor="middle">Leader</text></g>
<g class="sf-pop" style="--d:1.1s"><text class="sf-t-dim" x="24" y="368" text-anchor="start">Broker = 一台跑 Kafka 进程的服务器　　Topic = 消息的逻辑分类</text></g>
<g class="sf-pop" style="--d:1.2s"><text class="sf-t-dim" x="24" y="392" text-anchor="start">Partition = Topic 的物理分片，决定并行度　　Replica = 分片的副本，决定可靠性</text></g>
