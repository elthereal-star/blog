<g class="sf-pop" style="--d:1.2s"><rect class="sf-box" x="390" y="206" width="66" height="32" rx="4"/><text class="sf-t sf-mono sf-mid" x="423" y="222" text-anchor="middle">30</text></g>
<g class="sf-pop" style="--d:1.24s"><rect class="sf-box" x="456" y="206" width="66" height="32" rx="4"/><text class="sf-t sf-mono sf-mid" x="489" y="222" text-anchor="middle">50</text></g>
<g class="sf-pop" style="--d:1.3s"><rect class="sf-box" x="546" y="206" width="66" height="32" rx="4"/><text class="sf-t sf-mono sf-mid" x="579" y="222" text-anchor="middle">90</text></g>
<g class="sf-pop" style="--d:1.38s"><text class="sf-t-acc sf-mid" x="534" y="268" text-anchor="middle">70 交给父节点</text></g>
<g class="sf-pop" style="--d:1.42s"><text class="sf-t-sm sf-mid" x="534" y="290" text-anchor="middle">子节点里不再有它</text></g>
<g class="sf-pop" style="--d:1.5s"><text class="sf-t-dim sf-mid" x="360" y="334" text-anchor="middle">复制 = 数据键还在；上移 = 索引键搬家</text></g>
</svg>
