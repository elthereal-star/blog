<svg viewBox="0 0 720 360" role="img" aria-labelledby="key-exchange-t">
<title id="key-exchange-t">非对称加密只负责交换会话密钥</title>
<defs><marker id="key-exchange-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="key-exchange-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="key-exchange-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="key-exchange-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">为什么不能全程用非对称加密？</text>
<text class="sf-sub" x="24" y="48">非对称很安全但很慢，所以只让它干一件事：交换密钥</text>
<g class="sf-pop" style="--d:0.05s"><text class="sf-t-sm" x="24" y="96" text-anchor="start">阶段一</text></g>
<g class="sf-pop" style="--d:0.1s"><rect class="sf-box-a" x="24" y="106" width="216" height="78" rx="10"/><text class="sf-t sf-mid" x="132" y="137" text-anchor="middle">非对称加密</text><text class="sf-t-sm sf-mid" x="132" y="155" text-anchor="middle">RSA / ECC：安全但慢</text></g>
<path class="sf-line sf-draw" d="M240 145 L292 145" pathLength="1" marker-end="url(#key-exchange-ah-acc)" style="--d:0.3s"/>
<g class="sf-pop" style="--d:0.35s"><text class="sf-t-sm" x="266" y="132" text-anchor="middle">只传密钥</text></g>
<g class="sf-pop" style="--d:0.25s"><rect class="sf-box-solid" x="292" y="106" width="168" height="78" rx="10"/><text class="sf-t-inv sf-mid" x="376" y="137" text-anchor="middle">会话密钥</text><text class="sf-t-inv sf-mid" x="376" y="155" text-anchor="middle">Session Key</text></g>
<g class="sf-pop" style="--d:0.5s"><text class="sf-t-sm" x="24" y="218" text-anchor="start">阶段二</text></g>
<path class="sf-line sf-draw" d="M376 184 L376 232" pathLength="1" marker-end="url(#key-exchange-ah-acc)" style="--d:0.55s"/>
<g class="sf-pop" style="--d:0.65s"><rect class="sf-box-ok" x="24" y="232" width="660" height="80" rx="10"/><text class="sf-t-ok sf-mid" x="354" y="264" text-anchor="middle">对称加密：AES / ChaCha20</text><text class="sf-t-sm sf-mid" x="354" y="282" text-anchor="middle">之后所有数据都用这把会话密钥加解密，速度是非对称的上百倍</text></g>
<g class="sf-pop" style="--d:0.85s"><text class="sf-t-dim" x="24" y="344" text-anchor="start">结论：非对称负责「安全地交换」，对称负责「高效地传输」，两者分工，不是二选一。</text></g>
</svg>
