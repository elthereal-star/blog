<svg viewBox="0 0 720 380" role="img" aria-labelledby="claude-mods-t">
<title id="claude-mods-t">Claude Code 的 Mods 机制：事件穿过 Mod 链时被放行、改写或接管</title>
<defs><marker id="claude-mods-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="claude-mods-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="claude-mods-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="claude-mods-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">Claude Code 的事件流，现在可以中途插手</text>
<text class="sf-sub" x="24" y="48">每个事件穿过 Mod 链时，都能被放行、改写或直接接管</text>
<g class="sf-pop" style="--d:0.05s"><rect class="sf-box" x="24" y="100" width="136" height="56" rx="10"/><text class="sf-t sf-mid" x="92" y="120" text-anchor="middle">Claude Code</text><text class="sf-t-sm sf-mid" x="92" y="138" text-anchor="middle">抛出事件 e</text></g>
<path class="sf-line sf-draw" d="M160 128 L204 128" pathLength="1" marker-end="url(#claude-mods-ah-acc)" style="--d:0.15s"/>
<g class="sf-pop" style="--d:0.28s"><rect class="sf-box-a" x="208" y="100" width="118" height="56" rx="10"/><text class="sf-t sf-mid" x="267" y="120" text-anchor="middle">Mod A</text><text class="sf-t-sm sf-mid" x="267" y="138" text-anchor="middle">放行</text></g>
<path class="sf-line sf-draw" d="M326 128 L370 128" pathLength="1" marker-end="url(#claude-mods-ah-acc)" style="--d:0.38s"/>
<g class="sf-pop" style="--d:0.5s"><rect class="sf-box-a" x="374" y="100" width="118" height="56" rx="10"/><text class="sf-t sf-mid" x="433" y="120" text-anchor="middle">Mod B</text><text class="sf-t-sm sf-mid" x="433" y="138" text-anchor="middle">改写 + 放行</text></g>
<path class="sf-line sf-draw" d="M492 128 L536 128" pathLength="1" marker-end="url(#claude-mods-ah-acc)" style="--d:0.6s"/>
<g class="sf-pop" style="--d:0.72s"><rect class="sf-box" x="540" y="100" width="156" height="56" rx="10"/><text class="sf-t sf-mid" x="618" y="120" text-anchor="middle">模型 / 界面</text><text class="sf-t-sm sf-mid" x="618" y="138" text-anchor="middle">看到改过的结果</text></g>
<g class="sf-pop" style="--d:0.85s"><text class="sf-t-sm" x="24" y="190" text-anchor="start">一个 Mod 拿到事件之后，只有三种选择：</text></g>
<g class="sf-pop" style="--d:0.9s"><rect class="sf-box" x="24" y="200" width="214" height="92" rx="10"/><text class="sf-t sf-mid" x="131" y="229" text-anchor="middle">① 放行 next(e)</text><text class="sf-t-sm sf-mid" x="131" y="245" text-anchor="middle">原样交给下一个</text><text class="sf-t-dim sf-mid" x="131" y="261" text-anchor="middle">最安全的默认动作</text></g>
<g class="sf-pop" style="--d:1s"><rect class="sf-box" x="253" y="200" width="214" height="92" rx="10"/><text class="sf-t sf-mid" x="360" y="229" text-anchor="middle">② 改写后再放行</text><text class="sf-t-sm sf-mid" x="360" y="245" text-anchor="middle">换掉 e 里的字段</text><text class="sf-t-dim sf-mid" x="360" y="261" text-anchor="middle">改参数、脱敏、补上下文</text></g>
<g class="sf-pop" style="--d:1.1s"><rect class="sf-box" x="482" y="200" width="214" height="92" rx="10"/><text class="sf-t sf-mid" x="589" y="229" text-anchor="middle">③ 直接接管</text><text class="sf-t-sm sf-mid" x="589" y="245" text-anchor="middle">不再调用 next</text><text class="sf-t-dim sf-mid" x="589" y="261" text-anchor="middle">自己算完直接返回</text></g>
<path class="sf-line sf-draw" d="M24 322 L696 322" pathLength="1" stroke-dasharray="4 4" stroke-opacity="0.5" style="--d:1.25s"/>
<g class="sf-pop" style="--d:1.35s"><text class="sf-t-warn" x="24" y="348" text-anchor="start">注意：Mod 不做沙箱隔离，与你本机的 Claude Code 同权限，能读到环境变量里的密钥。</text></g>
</svg>
