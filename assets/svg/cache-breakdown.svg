<svg viewBox="0 0 720 420" role="img" aria-labelledby="cache-breakdown-t">
<title id="cache-breakdown-t">缓存击穿：热点 key 过期瞬间请求全部打到数据库</title>
<defs><marker id="cache-breakdown-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="cache-breakdown-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="cache-breakdown-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="cache-breakdown-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">缓存击穿：一个热点 key 过期，数据库被打爆</text>
<text class="sf-sub" x="24" y="48">和「穿透」「雪崩」的区别：击穿的关键词是「热点 key 刚好过期」</text>
<g class="sf-pop" style="--d:0.05s"><text class="sf-t-dim" x="24" y="96" text-anchor="start">正常情况：热点数据都在 Redis 里，DB 几乎没压力。问题只出在过期的那一瞬间。</text></g>
<g class="sf-pop" style="--d:0.15s"><rect class="sf-box" x="24" y="122" width="120" height="42" rx="10"/><text class="sf-t sf-mid" x="84" y="143" text-anchor="middle">请求 1</text></g>
<path class="sf-line sf-draw" d="M144 143 L218 182" pathLength="1" marker-end="url(#cache-breakdown-ah-dim)" style="--d:0.45s"/>
<g class="sf-pop" style="--d:0.23s"><rect class="sf-box" x="24" y="178" width="120" height="42" rx="10"/><text class="sf-t sf-mid" x="84" y="199" text-anchor="middle">请求 2</text></g>
<path class="sf-line sf-draw" d="M144 199 L218 187" pathLength="1" marker-end="url(#cache-breakdown-ah-dim)" style="--d:0.51s"/>
<g class="sf-pop" style="--d:0.31s"><rect class="sf-box" x="24" y="234" width="120" height="42" rx="10"/><text class="sf-t sf-mid" x="84" y="255" text-anchor="middle">请求 3</text></g>
<path class="sf-line sf-draw" d="M144 255 L218 192" pathLength="1" marker-end="url(#cache-breakdown-ah-dim)" style="--d:0.57s"/>
<g class="sf-pop" style="--d:0.5s"><rect class="sf-box-warn" x="220" y="150" width="170" height="80" rx="10"/><text class="sf-t-warn sf-mid" x="305" y="182" text-anchor="middle">Redis</text><text class="sf-t-sm sf-mid" x="305" y="200" text-anchor="middle">热点 key 刚好过期</text></g>
<path class="sf-line-warn sf-flow" d="M390 190 L498 190" marker-end="url(#cache-breakdown-ah-warn)" stroke-dasharray="5 5" style="--d:0.7s"/>
<g class="sf-pop" style="--d:0.75s"><text class="sf-t-warn" x="444" y="176" text-anchor="middle">全部穿透</text></g>
<g class="sf-pop" style="--d:0.6s"><rect class="sf-box-warn" x="500" y="150" width="170" height="80" rx="10"/><text class="sf-t-warn sf-mid" x="585" y="182" text-anchor="middle">MySQL</text><text class="sf-t-sm sf-mid" x="585" y="200" text-anchor="middle">瞬间扛下全部并发</text></g>
<circle class="sf-ring" cx="585" cy="190" r="58" fill="none" stroke="var(--sf-warn)" stroke-width="1.6" style="--d:0.95s"/>
<g class="sf-pop" style="--d:1s"><text class="sf-t-dim" x="24" y="288" text-anchor="start">常见解法</text></g>
<g class="sf-pop" style="--d:1.05s"><rect class="sf-box-a" x="24" y="302" width="200" height="44" rx="10"/><text class="sf-t-acc sf-mid" x="124" y="324" text-anchor="middle">互斥锁重建：只放一个请求进 DB</text></g>
<g class="sf-pop" style="--d:1.15s"><rect class="sf-box-a" x="240" y="302" width="216" height="44" rx="10"/><text class="sf-t-acc sf-mid" x="348" y="324" text-anchor="middle">逻辑过期：旧值先顶着，异步重建</text></g>
<g class="sf-pop" style="--d:1.25s"><rect class="sf-box-a" x="472" y="302" width="200" height="44" rx="10"/><text class="sf-t-acc sf-mid" x="572" y="324" text-anchor="middle">热点 key 干脆不设过期时间</text></g>
<g class="sf-pop" style="--d:1.35s"><text class="sf-t-dim" x="24" y="384" text-anchor="start">注意：不设过期时间只适合确定的热点数据，否则容易变成「脏数据永不失效」。</text></g>
</svg>
