<svg viewBox="0 0 720 370" role="img" aria-labelledby="rag-pipeline-t">
<title id="rag-pipeline-t">RAG 的离线索引与在线问答两阶段流程</title>
<defs><marker id="rag-pipeline-ah-acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="rag-pipeline-ah-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-warn)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="rag-pipeline-ah-ok" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--sf-ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="rag-pipeline-ah-dim" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1.9 1.7 L7.4 5 L1.9 8.3" fill="none" stroke="var(--border)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="sf-title" x="24" y="26">RAG 的核心流程</text>
<text class="sf-sub" x="24" y="48">先把知识切块存进向量库，回答时先检索、再让模型基于检索结果生成</text>
<g class="sf-pop" style="--d:0.05s"><text class="sf-t-sm" x="24" y="90" text-anchor="start">离线：把知识装进去</text></g>
<g class="sf-pop" style="--d:0.1s"><rect class="sf-box" x="24" y="100" width="144" height="56" rx="10"/><text class="sf-t sf-mid" x="96" y="120" text-anchor="middle">文档</text><text class="sf-t-sm sf-mid" x="96" y="138" text-anchor="middle">原始资料</text></g>
<g class="sf-pop" style="--d:0.2s"><rect class="sf-box" x="199" y="100" width="144" height="56" rx="10"/><text class="sf-t sf-mid" x="271" y="120" text-anchor="middle">切块</text><text class="sf-t-sm sf-mid" x="271" y="138" text-anchor="middle">按语义切分</text></g>
<g class="sf-pop" style="--d:0.3s"><rect class="sf-box" x="374" y="100" width="144" height="56" rx="10"/><text class="sf-t sf-mid" x="446" y="120" text-anchor="middle">向量化</text><text class="sf-t-sm sf-mid" x="446" y="138" text-anchor="middle">变成向量</text></g>
<g class="sf-pop" style="--d:0.4s"><rect class="sf-box" x="549" y="100" width="144" height="56" rx="10"/><text class="sf-t sf-mid" x="621" y="120" text-anchor="middle">向量库</text><text class="sf-t-sm sf-mid" x="621" y="138" text-anchor="middle">存储 + 索引</text></g>
<path class="sf-line sf-draw" d="M168 128 L199 128" pathLength="1" marker-end="url(#rag-pipeline-ah-acc)" style="--d:0.5s"/>
<path class="sf-line sf-draw" d="M343 128 L374 128" pathLength="1" marker-end="url(#rag-pipeline-ah-acc)" style="--d:0.5s"/>
<path class="sf-line sf-draw" d="M518 128 L549 128" pathLength="1" marker-end="url(#rag-pipeline-ah-acc)" style="--d:0.5s"/>
<g class="sf-pop" style="--d:0.7s"><text class="sf-t-sm" x="24" y="206" text-anchor="start">在线：用户提问之后</text></g>
<g class="sf-pop" style="--d:0.8s"><rect class="sf-box" x="24" y="216" width="112" height="56" rx="10"/><text class="sf-t sf-mid" x="80" y="244" text-anchor="middle">提问</text></g>
<g class="sf-pop" style="--d:0.88s"><rect class="sf-box" x="163" y="216" width="112" height="56" rx="10"/><text class="sf-t sf-mid" x="219" y="244" text-anchor="middle">向量化</text></g>
<g class="sf-pop" style="--d:0.96s"><rect class="sf-box" x="302" y="216" width="112" height="56" rx="10"/><text class="sf-t sf-mid" x="358" y="244" text-anchor="middle">检索 top-k</text></g>
<g class="sf-pop" style="--d:1.04s"><rect class="sf-box" x="441" y="216" width="112" height="56" rx="10"/><text class="sf-t sf-mid" x="497" y="244" text-anchor="middle">拼 Prompt</text></g>
<g class="sf-pop" style="--d:1.12s"><rect class="sf-box" x="580" y="216" width="112" height="56" rx="10"/><text class="sf-t sf-mid" x="636" y="244" text-anchor="middle">LLM 生成</text></g>
<path class="sf-line sf-draw" d="M136 244 L163 244" pathLength="1" marker-end="url(#rag-pipeline-ah-acc)" style="--d:1.1s"/>
<path class="sf-line sf-draw" d="M275 244 L302 244" pathLength="1" marker-end="url(#rag-pipeline-ah-acc)" style="--d:1.1s"/>
<path class="sf-line sf-draw" d="M414 244 L441 244" pathLength="1" marker-end="url(#rag-pipeline-ah-acc)" style="--d:1.1s"/>
<path class="sf-line sf-draw" d="M553 244 L580 244" pathLength="1" marker-end="url(#rag-pipeline-ah-acc)" style="--d:1.1s"/>
<path class="sf-line sf-draw" d="M621 158 L621 192 L358 192 L358 214" pathLength="1" marker-end="url(#rag-pipeline-ah-acc)" style="--d:1.25s"/>
<g class="sf-pop" style="--d:1.35s"><text class="sf-t-sm" x="490" y="184" text-anchor="middle">检索最相似的 N 块</text></g>
<g class="sf-pop" style="--d:1.45s"><text class="sf-t-dim" x="24" y="340" text-anchor="start">RAG 的关键不是「让模型记住」，而是「每次回答前，把相关资料现查现给」。</text></g>
</svg>
