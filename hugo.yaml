# ============================================================
#  Hugo 站点主配置
#  站点地址：https://elthereal-star.github.io/blog/
#  主题：PaperMod
# ============================================================

baseURL: "https://elthereal-star.github.io/blog/"
title: "elthereal-star 的技术笔记"
theme: PaperMod

# ---------- 语言与内容 ----------
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true   # 中文字数统计按字计算，而不是按空格分词
enableEmoji: true
summaryLength: 80      # 列表页摘要长度（字符）
timeZone: "Asia/Shanghai"

# ---------- 构建行为 ----------
buildDrafts: false
buildFuture: false
buildExpired: false
enableRobotsTXT: true
pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

# ---------- 输出格式 ----------
# home 必须输出 JSON，全文搜索（/search/ 页面）依赖它生成的索引
outputs:
  home:
    - HTML
    - RSS
    - JSON

# ---------- Markdown 渲染 ----------
markup:
  goldmark:
    renderer:
      unsafe: true      # 允许在文章里直接写 HTML
    extensions:
      footnote: true
      typographer: false
  highlight:
    noClasses: false    # 使用 CSS class，配合主题的代码高亮配色
    codeFences: true
    guessSyntax: true
    lineNos: false
    tabWidth: 4

# ---------- 导航菜单 ----------
# 与「墨序」改良版对齐：文章 / 碎碎念 / 专栏 / 归档 / 关于
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: moments
      name: 碎碎念
      url: /moments/
      weight: 20
    - identifier: categories
      name: 专栏
      url: /categories/
      weight: 30
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50
    # 说明：搜索不再放进主导航，而是右上角那颗带 ⌘K 的胶囊按钮，
    #       目标页仍然是 /search/（由 PaperMod 的 Fuse.js 全文检索提供）。
    #       项目文章仍留在 mainSections 里，会出现在首页列表与归档中。

# ---------- 站点参数 ----------
params:
  env: production
  description: "Java 后端学习笔记 · 项目复盘 · 测试工程实践"
  keywords: [Java, Spring Boot, Hugo, 后端, 测试, 博客]
  author: "elthereal-star"

  # 首页列表展示哪些板块的内容（文章 + 项目）
  mainSections:
    - posts
    - projects

  # 站点主标题区（头像/标题/副标题/按钮）
  # 注意：这里的路径不要写开头的斜杠，主题会自动拼上 baseURL 的 /blog/ 前缀
  label:
    text: "elthereal-star"
    icon: "favicon-32x32.png"
    iconHeight: 35

  # 首页简介块（homeInfoParams 必须保留：主题靠它判断首页是否渲染 info 区块）
  # Content 会作为 Hero 大标题下方的简介正文，写成一段最合适。
  homeInfoParams:
    Title: "记录思维火花，让文字与代码留下痕迹"
    Content: >
      这里记录我的 Java 后端学习笔记、项目复盘和一些测试工程上的踩坑记录。
      目前主要折腾 Spring Boot 3 / MyBatis-Plus / Vue 3 这条技术线，也在持续补
      Git 工作流和自动化测试的功课。

  # ---------- 品牌与仓库 ----------
  # 导航栏左上角那个方块里的字；改成你喜欢的单字即可
  brand:
    mark: "星"
    # 品牌名下方那行小字。留空则自动取 baseURL 的 域名+路径
    sub: ""

  # 用于导航栏的「写文章」按钮；换了仓库地址只改这里
  repo:
    url: "https://github.com/elthereal-star/blog"
    branch: "main"

  # 首页 Hero 区块（由 layouts/_partials/home_info.html 渲染）
  # 注意：Hero 上的文章数 / 项目数 / 总字数 / 最近更新时间都是模板实时算出来的，
  #       不要在这里写死，改了文章它们会自动更新。
  hero:
    status: "持续创作中"
    location: "中国"
    # 大标题，数组里第一个元素是主行，其余元素作为强调行另起一行
    title:
      - "把踩过的坑写下来，"
      - "让代码与思考留下痕迹。"
    # 头像。留空则显示成品牌单字的铭牌；填了就给一张图片（放 static/ 下）
    avatar: ""
    # 金句卡，点右侧刷新图标随机换一句
    quotes:
      - "简洁是智慧的灵魂，克制是最高级的设计审美。"
      - "程序是写给人读的，只是顺便让计算机执行。"
      - "过早的优化是万恶之源，但过早的放弃也是。"
      - "任何足够复杂的系统，都诞生于一个足够简单的原型。"
      - "把问题写清楚，就已经解决了一半。"
      - "能跑通不算完，能讲明白才算真懂。"

  # 首页社交图标
  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/elthereal-star"
    - name: email
      title: 邮箱
      url: "mailto:2838984524@qq.com"
    - name: rss
      title: RSS 订阅
      url: "https://elthereal-star.github.io/blog/index.xml"

  # ---------- 「关于」页（layouts/about.html 渲染）----------
  # 顶部名片 / 热力图 / 技术栈 / 书单都从这里取；正文仍是 content/about.md
  about:
    name: "elthereal-star"
    tagline: "Java 后端学习者 · 测试工程师 · 把踩过的坑写成文"
    badge: "独立创作者"
    location: "中国 · 杭州"
    github: "https://github.com/elthereal-star"
    email: "2838984524@qq.com"
    # 创作热力图：展示最近多少周（每列一周，每格一天）
    heatmapWeeks: 24
    heatmapTitle: "近期创作与思考热力图"
    heatmapNote: "按文章发布日期统计 · 每格一天"
    # 技术栈
    techStack:
      - name: "Java / Spring Boot 3"
        desc: "主线技术栈，业务代码与工程化"
      - name: "MyBatis-Plus / MySQL / Redis"
        desc: "数据层与缓存、分布式锁实践"
      - name: "Hugo + PaperMod"
        desc: "本站骨架，静态站点与模板覆盖"
      - name: "GitHub Actions"
        desc: "推送即构建，零服务器成本上线"
      - name: "Appium + Groovy"
        desc: "仪表 UI 自动化测试"
      - name: "原生 JS / Web Audio"
        desc: "零依赖动效与纯客户端白噪音合成"
    # 书单
    readingList:
      - title: "《深入理解 Java 虚拟机》"
        author: "周志明"
        note: "把「为什么」讲透的一本书"
      - title: "《重构：改善既有代码的设计》"
        author: "Martin Fowler"
        note: "保持代码呼吸感的圣经"
      - title: "《凤凰项目》"
        author: "Gene Kim"
        note: "从故事里理解交付流水线"
      - title: "《数字极简主义》"
        author: "Cal Newport"
        note: "在过度连接的世界重建深度工作"
    sign: "保持好奇，踏实行走 · Crafted with care & quiet typography"

  # ---------- 「碎碎念」页（content/moments/ + data/moments.yaml）----------
  moments:
    # 发表框里可选的「心情」标签
    moods:
      - "💭 闪念记录"
      - "☕️ 咖啡心流"
      - "🌧️ 细雨心流"
      - "💡 灵感涌现"
      - "🌙 深夜思考"
      - "🚀 灵光一闪"
    locationPlaceholder: "生活手记"

  # ---------- 禅意伴读白噪音（纯 Web Audio 合成，无外部音频文件）----------
  ambient:
    title: "禅意伴读白噪音"
    subtitle: "纯客户端 Web Audio 实时声学合成 · 助您沉浸心流"
    defaultVolume: 0.35
    sounds:
      - id: "rain"
        label: "静谧细雨"
        desc: "淅淅沥沥的自然雨滴与水汽"
        icon: "cloud-rain"
      - id: "fireplace"
        label: "温暖壁炉"
        desc: "木柴静静燃烧的温热爆裂声"
        icon: "flame"
      - id: "breeze"
        label: "旷野微风"
        desc: "穿过松林原野的柔和气流"
        icon: "wind"

  # ---------- 界面开关 ----------
  defaultTheme: auto          # 跟随系统深浅色，读者也能手动切换
  disableThemeToggle: false
  disableScrollToTop: false
  DateFormat: "2006年1月2日"    # 文章日期显示格式（Go 时间布局语法）
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: false
  ShowPostNavLinks: true      # 文章底部「上一篇 / 下一篇」
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true   # 代码块右上角一键复制
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  UseHugoToc: true            # 用 Hugo 内置目录生成
  ShowToc: true               # 文章页默认显示右侧目录
  TocOpen: false              # 目录默认折叠
  comments: false             # 未接入评论系统，需要时可开启 Giscus

  # 首页第一篇文章也用普通卡片样式（而非 PaperMod 默认的「巨幅首图」样式）
  disableSpecial1stPost: true
  hidemeta: false
  hideSummary: false

  # 文章底部「编辑此页」入口，方便自己从线上跳回 GitHub 改稿
  editPost:
    URL: "https://github.com/elthereal-star/blog/tree/main/content/"
    Text: "在 GitHub 上编辑"
    appendFilePath: true

  # ---------- 静态资源 ----------
  assets:
    disableHLJS: true         # 代码高亮交给 Hugo 内置的 Chroma，不加载 highlight.js
    # 同样不要写开头的斜杠，否则会指向根域名（丢 /blog/ 前缀）导致 404
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "safari-pinned-tab.svg"
    # 移动端浏览器地址栏配色，跟「纸白」主题一致
    theme_color: "#faf9f6"

  # ---------- 全文搜索（Fuse.js）----------
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 1
    keys: ["title", "permalink", "summary", "content"]

  # ---------- 文章版权声明 ----------
  # 如需页脚添加备案号等，可在此处使用 footer 自定义模板
